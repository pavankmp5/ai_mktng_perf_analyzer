[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-marketing-performance-analyser"
version = "0.1.0"
description = "Deterministic marketing performance analysis with extensible LLM reporting."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "Jinja2>=3.1",
    "httpx>=0.27",
    "numpy>=2.1",
    "pandas>=2.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[project.scripts]
marketing-analyser = "marketing_analyzer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marketing_analyzer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

